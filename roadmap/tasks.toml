schema_version = 2
project = "ex_unit_json"
default_branch = "development"
vision = "AI-friendly JSON test output for ExUnit — a drop-in 'mix test.json' that lets AI editors parse and reason about test results without grep/tail/sed."

[focus]
phase = 2

[phases.1]
name = "MVP Core Features"
order = 1
status = "done"

[phases.2]
name = "Future Enhancements"
order = 2
status = "in_progress"

[bundles.core]
phase = 1
order = 1
description = "Core JSON formatter — encoders, GenServer, mix task, filtering, output"

[bundles.ai_output]
phase = 1
order = 2
description = "AI-friendly output refinements (relative paths, truncation, --compact)"

[bundles.output_fields]
phase = 2
order = 1
description = "Output filtering, iteration & fields"

[bundles.failed_iteration]
